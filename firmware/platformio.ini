; furby-ai firmware
;
; Board: Elecrow CrowPanel Advance 4.3" - ESP32-S3, 800x480 IPS capacitive
; touch, onboard I2S microphone, onboard speaker + amplifier, USB-C, 16 MB
; flash / 8 MB PSRAM.
;
; Nothing from the Furby is connected to this board. No motor, no switches.
; The toy is a shell; this panel is the whole machine.
;
; NOTE ON THE CORE VERSION
; This pins Arduino-ESP32 2.x (platform espressif32 6.x) and the legacy
; driver/i2s.h API: boring, well documented, builds first time.
; Moving to Arduino-ESP32 3.x (pioarduino platform) would bring the newer
; i2s_std driver and ESP-SR / WakeNet for an on-device wake word. That is a
; later milestone - see the TODO in src/main.cpp.

[env:crowpanel]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1        ; generic S3 target; CrowPanel is pin-compatible enough
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1     ; serial over native USB
    -DCORE_DEBUG_LEVEL=3
    -Iinclude

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.1.0
    ; Face rendering (M2) will add LVGL plus the CrowPanel display driver here.
    ; Left out until there is code that uses it - an unused dependency is just
    ; a slower build and a longer list of things that can break.

monitor_filters = esp32_exception_decoder, time
