; furby-ai body-controller firmware
;
; Target: Elecrow CrowPanel ESP32 2.13" E-Paper HMI (DIE01021S)
; MCU: ESP32-S3, 8 MB flash, 8 MB PSRAM.
;
; v0.1 scope is deliberately small:
;   - Wi-Fi / WebSocket link to the Furby bridge
;   - body/status state machine
;   - e-paper integration using Elecrow's official driver/example as reference
;   - NO onboard audio path on this board
;   - NO Furby motor control yet
;
; Elecrow's own example repo currently documents Arduino-ESP32 2.0.10 for its
; bundled libraries. Keep the Arduino 2.x PlatformIO line until the real panel
; is on the desk and the display driver is validated.

[env:crowpanel_epaper_213]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -Iinclude

; The old 4.3" scaffold included I2S microphone/speaker sources. The 2.13"
; e-paper board does not provide that all-in-one audio hardware, so exclude
; those files until a real audio-output module is selected.
build_src_filter =
    +<*>
    -<audio/>

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.1.0
    ; Add the exact Elecrow-supplied EPD/GFX dependencies only after validating
    ; the official example against the physical board. Do not guess display
    ; driver variants in the repo.

monitor_filters = esp32_exception_decoder, time
