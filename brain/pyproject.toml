[project]
name = "furby-brain"
version = "0.1.0"
description = "Speech, reasoning and tool execution for furby-ai"
requires-python = ">=3.10"

dependencies = [
    "websockets>=12.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local pipeline. Heavy - torch arrives via silero-vad.
local = [
    "faster-whisper>=1.0",
    "silero-vad>=5.1",
    "piper-tts>=1.2",
]
# Cloud backends. Install whichever you actually use.
cloud = [
    "anthropic>=0.40",
    "openai>=1.40",
]
# For simulator.py - test the whole pipeline with a laptop mic.
sim = [
    "sounddevice>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
furby-brain = "furbybrain.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["furbybrain"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
